<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
(function(){
const W=1920,H=1080,CX=960,CY=540;
window.DURATION=15;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform=`scale(${s}) translate(-50%,-50%)`;wrap.style.left='50%';wrap.style.top='50%';}
// transform-origin 0 0 with translate after scale => translate in unscaled px; left/top 50% anchors
addEventListener('resize',fit);fit();

// ---------- utils ----------
const PI=Math.PI,TAU=PI*2;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5);
const ei3=x=>x*x*x, ei5=x=>Math.pow(x,5);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eoExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eiExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const eoBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eoElastic=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(TAU/3))+1;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(n)=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const C={ink:'#0b0b10',cream:'#f3efe6',orange:'#ff4b2b',lime:'#c6ff3d',cyan:'#2de2ff',violet:'#7a5cff'};
const SG="700 100px SG, 'Space Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif";
const fontSG=s=>`700 ${s}px SG, 'Space Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif`;
const fontJB=s=>`500 ${s}px JB, 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace`;
const BEAT=0.5;
function bg(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}

// letters helper: fn(i,n,w) -> {dx,dy,rot,sx,sy,a}
function word(str,size,cx,y,track,fn,mode){
  ctx.font=fontSG(size);ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const ws=[...str].map(ch=>ctx.measureText(ch).width);
  const total=ws.reduce((a,b)=>a+b,0)+track*(str.length-1);
  let x=cx-total/2;
  for(let i=0;i<str.length;i++){
    const o=fn?fn(i,str.length,ws[i]):{};
    if(o===null){x+=ws[i]+track;continue}
    ctx.save();
    ctx.translate(x+ws[i]/2+(o.dx||0),y+(o.dy||0));
    if(o.rot)ctx.rotate(o.rot);
    ctx.scale(o.sx==null?1:o.sx,o.sy==null?1:o.sy);
    ctx.globalAlpha*=(o.a==null?1:o.a);
    if(mode==='stroke')ctx.strokeText(str[i],0,0);else ctx.fillText(str[i],0,0);
    ctx.restore();

  }

}
function wordWidth(str,size,track){ctx.font=fontSG(size);return [...str].reduce((a,ch)=>a+ctx.measureText(ch).width,0)+track*(str.length-1)}
function mono(str,x,y,size,color,align,track){ctx.font=fontJB(size);ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';if('letterSpacing' in ctx)ctx.letterSpacing=(track||0)+'px';ctx.fillText(str,x,y);if('letterSpacing' in ctx)ctx.letterSpacing='0px'}
function rrect(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circle(x,y,r){if(r<=0)return;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}

// ---------- precomputed (seeded) ----------
const rng=mulberry(20260930);
const cellHash=[];for(let i=0;i<16*9;i++)cellHash.push(rng());
const SPH=[];{const N=720;for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;SPH.push([Math.cos(th)*r,y,Math.sin(th)*r,rng()])}}
const noiseC=document.createElement('canvas');noiseC.width=noiseC.height=256;
{const n=noiseC.getContext('2d'),d=n.createImageData(256,256),r2=mulberry(7);for(let i=0;i<d.data.length;i+=4){const v=r2()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)}
const noisePat=ctx.createPattern(noiseC,'repeat');

// ---------- transitions ----------
function stripes(t,T,color,n,win){
  const a=p(t,T-win,T),b=p(t,T,T+win);
  if(a<=0||b>=1)return;
  ctx.fillStyle=color;const bw=W/n;
  for(let k=0;k<n;k++){
    const d=(k/n)*.55;
    if(t<T){const q=eio(clamp(a*1.55-d));ctx.fillRect(k*bw,0,bw+1,H*q)}
    else{const q=eio(clamp(b*1.55-d));ctx.fillRect(k*bw,H*q,bw+1,H-H*q)}
  }
}

// ---------- SCENE A 0-3 : title ----------
function sceneA(t){
  bg(C.ink);
  // faint dot grid
  ctx.fillStyle='rgba(243,239,230,.10)';
  const gp=eo3(p(t,0,.8));
  for(let x=0;x<=W;x+=80)for(let y=0;y<=H;y+=80){const d=Math.hypot(x-CX,y-CY)/1100;const s=clamp(gp*1.6-d);circle(x,y,2.2*s)}
  // circle
  ctx.fillStyle=C.orange;
  const flood=eio(p(t,2.35,3.0));
  const R=(330*eoBack(p(t,0,.75)))+flood*1700;
  circle(CX,CY,R);
  // rules
  const lp=eoExpo(p(t,.25,.95));
  ctx.fillStyle=C.cream;
  ctx.globalAlpha=1-p(t,2.5,2.8);
  ctx.fillRect(CX-760*lp,300,1520*lp,3);
  ctx.fillRect(CX-760*lp,770,1520*lp,3);
  // letters masked rising
  ctx.save();ctx.beginPath();ctx.rect(0,330,W,345);ctx.clip();
  ctx.fillStyle=C.cream;
  word('MOTION',350,CX,660,4,(i,n)=>{const s=.35+i*.07;const q=eoExpo(p(t,s,s+.85));return{dy:(1-q)*420,a:1}});
  ctx.restore();
  // outline subtitle
  const sp=eoExpo(p(t,1.15,1.85));
  ctx.save();ctx.beginPath();ctx.rect(CX-800,690,1600*sp,100);ctx.clip();
  ctx.font=fontSG(84);ctx.strokeStyle=C.cream;ctx.lineWidth=2.5;
  word('DESIGNER',84,CX,762,70,null,'stroke');
  ctx.restore();
  // mono labels (typed)
  const s1='SHOWREEL / 2026';const n1=Math.floor(clamp((t-.6)/1.0)*s1.length);
  mono(s1.slice(0,n1)+(n1<s1.length&&Math.floor(t*10)%2?'_':''),120,150,26,C.cream,'left',4);
  const s2='15 SEC  /  120 BPM  /  ALL CODE';const n2=Math.floor(clamp((t-1.0)/1.0)*s2.length);
  mono(s2.slice(0,n2),120,930,22,'rgba(243,239,230,.65)','left',4);
  ctx.globalAlpha=1;
  // fade text as flood hits
}

// ---------- SCENE B 3-6 : grid morph ----------
function sceneB(t){
  bg(C.orange);
  const cs=120;
  for(let j=0;j<9;j++)for(let i=0;i<16;i++){
    const h=cellHash[j*16+i];
    const dx=(i-7.5)/8,dy=(j-4)/4.5;const d=Math.hypot(dx,dy)/1.3;
    const a=.05+d*.75, s=eoBack(p(t,a,a+.55));
    const out=ei3(p(t,2.35+(1-d)*.45,2.75+(1-d)*.45));
    const sc=s*(1-out);
    if(sc<=0.001)continue;
    const m=.5+.5*Math.sin(t*3.6*1 - d*7+h*2);
    const size=cs*.76*sc*(.75+.25*m);
    const rad=size*.5*(1-m*.96)+0;
    ctx.save();ctx.translate(i*cs+cs/2,j*cs+cs/2);ctx.rotate((1-m)*PI/2*(h>.5?1:-1)*(1-eo3(p(t,a,a+.9)))+m*PI/2*(h>.5?-1:1)*.0);
    ctx.fillStyle=h<.68?C.ink:h<.9?C.cream:C.lime;
    rrect(-size/2,-size/2,size,size,rad);ctx.fill();ctx.restore();
  }
  // plate
  const pin=eoExpo(p(t,.9,1.4)), pout=eio(p(t,2.35,2.75));
  const pw=1080*pin, ph=300*(1-pout);
  if(ph>1&&pw>1){
    ctx.fillStyle=C.ink;ctx.fillRect(CX-pw/2,CY-ph/2,pw,ph);
    ctx.save();ctx.beginPath();ctx.rect(CX-pw/2,CY-ph/2,pw,ph);ctx.clip();
    ctx.fillStyle=C.cream;
    word('FORM',210,CX,CY+52,10,(i)=>{const q=eoExpo(p(t,1.05+i*.05,1.6+i*.05));return{dy:(1-q)*260}});
    mono('SHAPE  /  RHYTHM  /  CONTRAST',CX,CY+112,20,C.lime,'center',6);
    ctx.restore();
  }
}

// ---------- SCENE C 6-9 : words on the beat ----------
function sceneC(lt){
  const w=Math.min(5,Math.floor(lt/BEAT)),wl=lt-w*BEAT;
  const names=['RHYTHM','SPACE','TIME','LIGHT','DEPTH','FLOW'];
  const bgs=[C.ink,C.lime,C.violet,C.cream,C.ink,C.cyan];
  const fgs=[C.cream,C.ink,C.cream,C.ink,C.cream,C.ink];
  bg(bgs[w]);const fg=fgs[w];ctx.fillStyle=fg;
  const str=names[w],S=360;
  const kick=1+.035*Math.exp(-wl*14);
  ctx.save();ctx.translate(CX,CY);ctx.scale(kick,kick);ctx.translate(-CX,-CY);
  const y=CY+128;
  if(w===0){
    const q=eoExpo(p(wl,0,.22));
    const sc=1+(1-q)*1.6;
    for(let e=3;e>=1;e--){ctx.save();ctx.translate(CX,CY);const s2=sc+e*.09*(1-.4*p(wl,.1,.5));ctx.scale(s2,s2);ctx.translate(-CX,-CY);ctx.strokeStyle=C.orange;ctx.lineWidth=3;ctx.globalAlpha=.55/e;word(str,S,CX,y,6,null,'stroke');ctx.restore()}
    ctx.save();ctx.translate(CX,CY);ctx.scale(sc,sc);ctx.translate(-CX,-CY);ctx.globalAlpha=clamp(wl/.04);word(str,S,CX,y,6);ctx.restore();
  }else if(w===1){
    const q=eoExpo(p(wl,0,.45));
    ctx.fillStyle=fg;word(str,S,CX,y,lerp(-70,90,q),(i,n)=>({a:clamp(wl/.05)}));
    ctx.fillStyle=C.ink;ctx.fillRect(CX-700*q,y+50,1400*q,10);
  }else if(w===2){
    const q=eoBack(p(wl,0,.26));
    ctx.save();ctx.strokeStyle=C.cream;ctx.lineWidth=6;ctx.beginPath();ctx.arc(CX,CY,100+eo3(p(wl,0,.5))*900,0,TAU);ctx.globalAlpha=1-p(wl,0,.5);ctx.stroke();ctx.restore();
    ctx.fillStyle=fg;word(str,S*1.15,CX,y+20,6,(i,n)=>({dx:(1-q)*-1500*(1+i*.05)}));
    // ticking clock hand
    ctx.save();ctx.strokeStyle=C.lime;ctx.lineWidth=12;ctx.lineCap='round';ctx.translate(CX,CY-330);ctx.rotate(wl*TAU*2-PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(70,0);ctx.stroke();ctx.restore();
  }else if(w===3){
    ctx.fillStyle=fg;
    word(str,S,CX,y,14,(i,n)=>{const q=eoBack(p(wl,i*.035,i*.035+.22));return{sy:q,dy:(1-q)*-60,a:clamp(q*3)}});
    const q=eoExpo(p(wl,.05,.4));ctx.fillStyle=C.orange;ctx.fillRect(CX-780,CY-290,1560*q,14);ctx.fillRect(CX+780-1560*q,CY+250,1560*q,14);
  }else if(w===4){
    const q=eoExpo(p(wl,0,.3));
    const ex=lerp(0,-1,q)*1,ey=lerp(0,1,q);
    for(let k=30;k>=1;k--){
      const f=k/30;ctx.fillStyle=`rgb(${Math.round(lerp(255,90,f))},${Math.round(lerp(75,20,f))},${Math.round(lerp(43,15,f))})`;
      const off=k*3.2*q;
      word(str,S,CX+off*.75,y+off*.75,4);
    }
    ctx.fillStyle=C.cream;word(str,S,CX,y,4);
  }else{
    const amp=eo3(p(wl,0,.2))*70*(1-.6*p(wl,.3,.5));
    ctx.fillStyle=fg;
    word(str,S,CX,y,8,(i,n)=>({dy:Math.sin(wl*18-i*.9)*amp,rot:Math.sin(wl*18-i*.9)*.05*(amp/70),a:clamp(wl/.03)}));
    ctx.strokeStyle=C.ink;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();
    for(let x=-20;x<=W+20;x+=16){const yy=CY+260+Math.sin(x*.012-wl*20)*24*eo3(p(wl,0,.2));x<0?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke();
  }
  ctx.restore();
  // counter + ticks
  mono('0'+(w+1)+' / 06',120,150,26,fg,'left',4);
  for(let k=0;k<6;k++){ctx.fillStyle=fg;ctx.globalAlpha=k<=w?1:.25;ctx.fillRect(120+k*56,950,44,8)}
  ctx.globalAlpha=1;
  // beat cut flash bar
  const fl=1-p(wl,0,.09);if(fl>0){ctx.fillStyle=fg;ctx.globalAlpha=fl*.9;ctx.fillRect(0,0,W,H*fl*.12);ctx.globalAlpha=1}
}

// ---------- SCENE D 9-12 : tunnel + sphere ----------
function sceneD(lt){
  bg('#07070c');
  const intro=eo3(p(lt,0,.4));
  const N=26;
  ctx.save();ctx.translate(CX,CY);ctx.lineJoin='round';
  for(let k=0;k<N;k++){
    const z=((k/N)+lt*.22)%1;
    const s=30+Math.pow(z,3.2)*3300;
    const a=clamp(z*5)*intro*(1-clamp((z-.9)*10));
    if(a<=0)continue;
    ctx.save();ctx.rotate(k*.17+lt*.5+Math.sin(lt*1.3)*.3);
    ctx.globalAlpha=a*.6;
    ctx.lineWidth=2+z*7;
    ctx.strokeStyle=`hsl(${(12+z*260+lt*50)%360},95%,${55+z*10}%)`;
    ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore();
  }
  ctx.restore();
  // sphere
  const grow=ei5(p(lt,2.35,3.0));
  let R=(330+30*Math.exp(-((lt%BEAT))*10))*eoBack(p(lt,.15,.9));R+=grow*2600;
  const ay=lt*1.1,ax=.45,cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
  const pts=[];
  for(const q of SPH){let x=q[0],y=q[1],z=q[2];let x1=x*cy+z*sy,z1=-x*sy+z*cy;let y1=y*cx-z1*sx,z2=y*sx+z1*cx;pts.push([x1,y1,z2,q[3]])}
  pts.sort((a,b)=>a[2]-b[2]);
  for(const q of pts){
    const f=1/(1-q[2]*.35);const x=CX+q[0]*R*f,y=CY+q[1]*R*f;
    if(x<-50||x>W+50||y<-50||y>H+50)continue;
    const d=(q[2]+1)/2;
    ctx.fillStyle=q[3]<.12?C.lime:(d>.5?C.cream:C.orange);
    ctx.globalAlpha=.25+d*.75;
    circle(x,y,(2+d*4.6)*f*(1+grow*3));
  }
  ctx.globalAlpha=1;
  // orbit rings
  ctx.save();ctx.translate(CX,CY);ctx.strokeStyle='rgba(243,239,230,.5)';ctx.lineWidth=2;
  for(let k=0;k<3;k++){ctx.save();ctx.rotate(lt*.4*(k%2?-1:1)+k*1.0);const rr=(R+70+k*40)*(1-grow*0);ctx.beginPath();ctx.ellipse(0,0,rr,rr*.28,0,0,TAU);ctx.globalAlpha=intro*(1-grow);ctx.stroke();
    const ang=lt*(2.2+k*.7)+k*2;ctx.fillStyle=C.lime;ctx.globalAlpha=intro*(1-grow);circle(Math.cos(ang)*rr,Math.sin(ang)*rr*.28,8);ctx.restore()}
  ctx.restore();ctx.globalAlpha=1;
  // text
  const tp=eoExpo(p(lt,.55,1.25)),tout=1-p(lt,2.3,2.6);
  ctx.globalAlpha=tout;
  ctx.save();ctx.beginPath();ctx.rect(100,120,1000,210);ctx.clip();
  ctx.fillStyle=C.cream;ctx.font=fontSG(96);ctx.textAlign='left';ctx.fillText('THREE',120,215+(1-tp)*120);ctx.fillText('DIMENSIONS.',120,215+96+(1-eoExpo(p(lt,.65,1.35)))*120);
  ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(100,120,1000,260);ctx.clip();ctx.restore();
  mono('NO ENGINE  /  NO LIBRARIES  /  720 POINTS',120,930,22,'rgba(243,239,230,.7)','left',4);
  ctx.globalAlpha=1;
  // white flash out
  const fo=eio(p(lt,2.7,3.0));if(fo>0){ctx.fillStyle='#fff';ctx.globalAlpha=fo;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}

// ---------- SCENE E 12-13.5 : waves ----------
function sceneE(lt){
  bg(C.cream);
  const L=38;
  const fo=1-eo3(p(lt,0,.3)); // decay of flash handled below
  for(let k=0;k<L;k++){
    const u=k/(L-1);const env=Math.sin(u*PI);
    const y0=110+u*860;
    const reveal=eoExpo(p(lt,.02+u*.25,.55+u*.25));
    ctx.beginPath();
    const xEnd=W*reveal;
    for(let x=0;x<=xEnd;x+=10){
      const y=y0+Math.sin(x*.0035+lt*4-u*3.2)*(30+90*env)*Math.cos(x*.0012+lt*1.3+u)+Math.sin(x*.011-lt*6+u*9)*10*env;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    const hot=(k===19);
    ctx.strokeStyle=hot?C.orange:(k%6===0?C.violet:C.ink);ctx.lineWidth=hot?7:2.2;ctx.stroke();
  }
  // text with cream halo
  ctx.lineJoin='round';
  function line(str,y,col,sT){
    const q=eoExpo(p(lt,sT,sT+.4));
    ctx.save();ctx.beginPath();ctx.rect(0,y-200,W,240);ctx.clip();
    ctx.font=fontSG(200);ctx.textAlign='center';
    ctx.lineWidth=34;ctx.strokeStyle=C.cream;ctx.strokeText(str,CX,y+(1-q)*230);
    ctx.fillStyle=col;ctx.fillText(str,CX,y+(1-q)*230);ctx.restore();
  }
  line('NO KEYFRAMES.',520,C.ink,.15);
  line('JUST MATH.',750,C.orange,.3);
  // beat stab
  // flash decay
  const fd=1-eo3(p(lt,0,.25));if(fd>0){ctx.fillStyle='#fff';ctx.globalAlpha=fd;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  // exit wipe
  const wp=eio(p(lt,1.2,1.5));if(wp>0){ctx.fillStyle=C.ink;ctx.save();ctx.beginPath();ctx.moveTo(-200,0);ctx.lineTo(-200+(W+600)*wp,0);ctx.lineTo(-200+(W+600)*wp-300,H);ctx.lineTo(-200,H);ctx.fill();ctx.restore()}
}

// ---------- SCENE F 13.5-15 : lockup ----------
function sceneF(lt){
  bg(C.ink);
  const out=eio(p(lt,1.2,1.5));
  // beat rings
  for(let b=0;b<3;b++){const q=p(lt-b*BEAT,0,.5);if(q>0&&q<1){ctx.strokeStyle=C.orange;ctx.globalAlpha=(1-q)*.8;ctx.lineWidth=4;ctx.beginPath();ctx.arc(CX,400,110+eo3(q)*700,0,TAU);ctx.stroke()}}
  ctx.globalAlpha=1;
  ctx.fillStyle=C.orange;
  const k=1+.08*Math.exp(-(lt%BEAT)*12);
  circle(CX,400,(110*eoBack(p(lt,0,.5)))*k*(1-out));
  // tiny orbiting dot
  ctx.fillStyle=C.cream;const a=lt*5;circle(CX+Math.cos(a)*170,400+Math.sin(a)*170,9*eoBack(p(lt,.3,.7))*(1-out));
  ctx.globalAlpha=1-out;
  ctx.fillStyle=C.cream;
  ctx.save();ctx.beginPath();ctx.rect(0,560,W,170);ctx.clip();
  word('MOTION DESIGN,',120,CX,660,4,(i,n)=>{const s=.15+i*.022;return{dy:(1-eoExpo(p(lt,s,s+.45)))*140}});
  ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(0,690,W,170);ctx.clip();
  ctx.fillStyle=C.orange;
  word('ENTIRELY IN CODE.',120,CX,790,4,(i,n)=>{const s=.4+i*.02;return{dy:(1-eoExpo(p(lt,s,s+.45)))*140}});
  ctx.restore();
  const m=eo3(p(lt,.8,1.1));
  mono('1920x1080  /  15 SEC  /  0 ASSETS  /  100% MATH',CX,900,24,C.cream,'center',5);
  ctx.globalAlpha=1;
}

// ---------- HUD & post ----------
function hud(t){
  ctx.save();ctx.globalCompositeOperation='difference';
  ctx.fillStyle='#fff';ctx.globalAlpha=.85;
  const pr=t/15;
  ctx.fillRect(120,1010,1680*pr,3);ctx.globalAlpha=.3;ctx.fillRect(120,1010,1680,3);ctx.globalAlpha=.85;
  const ss=Math.floor(t),ff=Math.floor((t-ss)*30);
  mono('00:'+String(ss).padStart(2,'0')+':'+String(ff).padStart(2,'0'),1800,150,26,'#fff','right',4);
  const beat=Math.floor(t/BEAT)%4+1;
  for(let i=0;i<4;i++){ctx.globalAlpha=i+1===beat?.95:.25;ctx.fillRect(1800-i*34-22,946+0,22,22-0)}
  ctx.restore();
}
function post(t){
  const v=ctx.createRadialGradient(CX,CY,420,CX,CY,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  const f=Math.floor(t*24);const ox=Math.floor(hash(f)*256),oy=Math.floor(hash(f+99)*256);
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.16;ctx.translate(-ox,-oy);ctx.fillStyle=noisePat;ctx.fillRect(0,0,W+256,H+256);ctx.restore();
}

// ---------- master ----------
function render(t){
  t=clamp(t,0,15-1e-6);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // global beat push
  const kick=1+.012*Math.exp(-(t%BEAT)*10);
  ctx.translate(CX,CY);ctx.scale(kick,kick);ctx.translate(-CX,-CY);
  if(t<3)sceneA(t);
  else if(t<6)sceneB(t-3);
  else if(t<9)sceneC(t-6);
  else if(t<12)sceneD(t-9);
  else if(t<13.5)sceneE(t-12);
  else sceneF(t-13.5);
  ctx.globalAlpha=1;
  stripes(t,6,C.ink,12,.3);
  ctx.restore();
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  hud(t);post(t);ctx.restore();
}
window.seek=function(t){render(+t||0)};
window.render=render;
const q=new URLSearchParams(location.search);
const extern=window.__capture===true||q.has('seek');
const fontsReady=Promise.all([document.fonts.load(fontSG(100)),document.fonts.load(fontJB(20))]).catch(()=>{});
window.__ready=fontsReady;
render(q.has('seek')?parseFloat(q.get('seek')):0);
fontsReady.then(()=>render(q.has('seek')?parseFloat(q.get('seek')):0));
if(!extern){
  let t0=null;
  const loop=ts=>{if(t0===null)t0=ts;render(((ts-t0)/1000)%15);requestAnimationFrame(loop)};
  fontsReady.then(()=>requestAnimationFrame(loop));
}
})();
</script></body></html>
