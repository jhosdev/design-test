<script>
// ---- Deterministic MLP (4-6-6-3, ReLU, softmax) trained on Iris at setup ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildModel(RAW, SEED, EPOCHS){
  const rows = RAW.trim().split('\n').map(r=>r.split(','));
  const CLASSES = ['setosa','versicolor','virginica'];
  const X = rows.map(r=>r.slice(0,4).map(Number));
  const Y = rows.map(r=>CLASSES.indexOf(r[4]));
  const mn=[0,1,2,3].map(j=>Math.min(...X.map(r=>r[j]))), mx=[0,1,2,3].map(j=>Math.max(...X.map(r=>r[j])));
  const XN = X.map(r=>r.map((v,j)=>(v-mn[j])/(mx[j]-mn[j])));
  const rnd = mulberry32(SEED);
  const gauss=()=>{let u=0,v=0;while(u===0)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const sizes=[4,6,6,3];
  // W[l][j][i] : weight from neuron i (layer l) to neuron j (layer l+1)
  let W=[],B=[];
  for(let l=0;l<3;l++){const nin=sizes[l],nout=sizes[l+1];
    W.push(Array.from({length:nout},()=>Array.from({length:nin},()=>gauss()*Math.sqrt(2/nin))));

    for(let l=0;l<3;l++){const z=p.W[l].map((row,j)=>row.reduce((s,w,i)=>s+w*a[i],p.B[l][j]));const zq=z.map(q);Z.push(zq);
      a=l<2?zq.map(v=>Math.max(0,v)):zq;A.push(a);}

  const z=F.Z[l],tk=[{s:'a = max(0, z)  →  ',c:'#f2f4f8',t:t0+.05}];
  for(let i=0;i<z.length;i++){const ti=t0+.2+.08*i,snap=t>=t0+.5;if(i>0)tk.push({s:'  ',c:'#fff',t:ti});
    const v=snap?Math.max(0,z[i]):z[i];const s=snap?v.toFixed(2):fmtS(z[i]);
    tk.push({s:s.padStart(5,' '),c:snap?(z[i]<0?'#ff8196':rgba(WARM,1)):(z[i]>=0?'#8cb6ff':'#ff8196'),t:ti});}
  txt(l===1?'HIDDEN LAYER 1 · 6 NEURONS':'HIDDEN LAYER 2 · 6 NEURONS',112,Y-52,JB(400,17),'rgba(170,185,215,'+(0.75*a)+')','left','1px');
  eq(tk,112,Y,t,a,JB(500,29));
}
function drawReluPanel(t){
  for(const [l,t0] of [[1,T.r1],[2,T.r2]]){const a=win(t,t0+.02,t0+2,.25,.2);if(a<=0)continue;
    const z=F.Z[l],rng_=Math.ceil(Math.max(...z.map(Math.abs))*1.1),x0=112,y0=310,w=360,h=360,cx=x0+w/2,cy=y0+h*0.62;
    const sx=v=>cx+v/rng_*(w/2),sy=v=>cy-v/rng_*(w/2);
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(12,15,24,0.82)';ctx.fillRect(x0-14,y0-14,w+28,h+28);ctx.strokeStyle='rgba(200,215,255,0.15)';ctx.lineWidth=1;ctx.strokeRect(x0-14,y0-14,w+28,h+28);
    ctx.strokeStyle='rgba(200,215,255,0.28)';ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x0+w,cy);ctx.moveTo(cx,y0);ctx.lineTo(cx,y0+h);ctx.stroke();
    txt('z',x0+w-4,cy-10,JB(400,15),'rgba(170,185,215,.7)','right');txt('a',cx+8,y0+14,JB(400,15),'rgba(170,185,215,.7)');
    txt(String(-rng_),sx(-rng_)+2,cy+22,JB(400,13),'rgba(170,185,215,.5)');txt(String(rng_),sx(rng_)-2,cy+22,JB(400,13),'rgba(170,185,215,.5)','right');
    // identity (dashed) and ReLU (solid)
    const dr=oE(seg(t,t0,t0+.4));
    ctx.setLineDash([5,6]);ctx.strokeStyle='rgba(200,215,255,.25)';ctx.beginPath();ctx.moveTo(sx(-rng_*.7),sy(-rng_*.7));ctx.lineTo(sx(lerp(-rng_*.7,rng_,dr)),sy(lerp(-rng_*.7,rng_,dr)));ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=rgba(ACID,1);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sx(-rng_),sy(0));ctx.lineTo(sx(0),sy(0));
    ctx.lineTo(sx(rng_*dr),sy(rng_*dr));ctx.stroke();
    txt('max(0, z)',x0+6,y0+26,JB(700,20),rgba(ACID,1));
    // the 6 actual pre-activations snap onto the ReLU
    const u=oE(seg(t,t0+.5,t0+.85));
    for(let i=0;i<z.length;i++){const ai=oB(seg(t,t0+.15+.06*i,t0+.4+.06*i));if(ai<=0)continue;
      const px=sx(z[i]),py=sy(lerp(z[i],Math.max(0,z[i]),u));const c=z[i]>=0?WARM:NEG;
      if(z[i]<0&&u>0&&u<1){ctx.strokeStyle=rgba(NEG,.6);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,sy(z[i]));ctx.lineTo(px,py);ctx.stroke();}
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*.9;ctx.drawImage(z[i]>=0?GL.warm:GL.neg,px-26,py-26,52,52);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a;
      ctx.fillStyle=rgba(c,1);ctx.beginPath();ctx.arc(px,py,6*ai,0,7);ctx.fill();}
    ctx.globalAlpha=1;}
}
function drawLearn(t,S){
  const a=win(t,T.le+.05,19.4,.2,.35);if(a<=0)return;band(a);
  // loss curve, drawn up to current epoch
  const x0=112,y0=920,w=720,h=118,Lmax=Math.max(...M.loss);ctx.globalAlpha=a;
  txt('LOSS  (mean cross-entropy, all 150 flowers)',x0,y0-10,JB(400,15),'rgba(170,185,215,.75)','left','1px');
  ctx.strokeStyle='rgba(200,215,255,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y0+h);ctx.lineTo(x0+w,y0+h);ctx.stroke();
  const px=e=>x0+Math.pow(e/EP,1/WARP)*w,py=v=>y0+8+(1-v/Lmax)*(h-8);    // x axis matches the sweep's time-warp
  ctx.strokeStyle=rgba(ACID,1);ctx.lineWidth=3;ctx.beginPath();for(let e=0;e<=S.ep;e++){const X=px(e),Y=py(M.loss[e]);e?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();
  ctx.globalCompositeOperation='lighter';ctx.drawImage(GL.acid,px(S.ep)-24,py(M.loss[S.ep])-24,48,48);ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  // readouts
  const rx=900;ctx.globalAlpha=a;
  txt('EPOCH',rx,y0+6,JB(500,15),'rgba(170,185,215,.75)','left','3px');
  txt(String(S.ep).padStart(3,'0'),rx,y0+86,JB(700,84),'#f2f4f8');
  txt('LOSS',rx+230,y0+6,JB(500,15),'rgba(170,185,215,.75)','left','3px');txt(M.loss[S.ep].toFixed(3),rx+230,y0+60,JB(700,40),rgba(ACID,1));
  txt('ACCURACY',rx+430,y0+6,JB(500,15),'rgba(170,185,215,.75)','left','3px');txt((M.acc[S.ep]*100).toFixed(1)+'%',rx+430,y0+60,JB(700,40),'#f2f4f8');
  ctx.globalAlpha=1;
  // the flip
  if(FLIP!==null){const fa=win(t,FLIP,FLIP+1.1,.08,.3);if(fa>0){const n=N[3][TRUE];
    const [s,cx,cy]=cam(t),kx=960+(n.x+R[3]+34-cx)*s,ky=540+(n.y+46-cy)*s;
    ctx.globalAlpha=fa;ctx.fillStyle=rgba(ACID,1);const lab='PREDICTION FLIPS → '+CLS[TRUE];ctx.font=JB(700,16);const lw=ctx.measureText(lab).width+20;
    ctx.fillRect(kx,ky-4,lw*oE(seg(t,FLIP,FLIP+.25)),28);ctx.fillStyle='#05060a';ctx.textAlign='left';ctx.letterSpacing='1px';
    ctx.save();ctx.beginPath();ctx.rect(kx,ky-4,lw*oE(seg(t,FLIP,FLIP+.25)),28);ctx.clip();ctx.fillText(lab,kx+10,ky+16);ctx.restore();ctx.letterSpacing='0px';ctx.globalAlpha=1;}}
}
function drawKinetic(t,S){
  // intro — loop-safe: nothing on screen at t=0
  kin('HOW A',108,330,188,t,.5,1.9);
  kin('NEURAL NETWORK',108,520,188,t,1.0,1.93,{stroke:3,col:'#f2f4f8'});
  kin('THINKS.',108,710,188,t,1.5,1.96,{col:rgba(ACID,1)});
  // prediction slam
  if(t>=T.pr-.1&&t<T.le+.4){const d=win(t,T.pr,T.le,.05,.05);
    ctx.fillStyle='rgba(5,6,10,'+(.66*d)+')';ctx.fillRect(0,0,W,H);
    txt('PREDICTION',112,372,JB(700,22),rgba(ACID,win(t,T.pr+.05,T.le-.05,.15,.1)),'left','6px');
    kin(CLS[argmax(F.P)],104,560,190,t,T.pr,T.le-.18,{col:rgba(ACID,1),dur:.3});
    kin((F.P[argmax(F.P)]*100).toFixed(1)+'% CONFIDENT',110,660,64,t,T.pr+.5,T.le-.16,{col:'#f2f4f8',ls:'0px'});
  }
  // rewind
  kin('REWIND',104,560,230,t,T.le,T.le+.42,{col:rgba(NEG,1),dur:.18,outDur:.14});
  kin('EPOCH 0: RANDOM WEIGHTS',110,640,44,t,T.le+.08,T.sw0-.02,{col:'#f2f4f8',ls:'1px',dur:.2,outDur:.14});
  // outro
  {const d=win(t,T.out,19.75,.15,.3);if(d>0){ctx.fillStyle='rgba(5,6,10,'+(.55*d)+')';ctx.fillRect(0,0,W,H);}}
  kin(NPARAM+' NUMBERS.',108,470,188,t,T.out,19.5,{col:'#f2f4f8'});
  kin('ONE GUESS.',108,660,188,t,T.out+.5,19.55,{col:rgba(ACID,1)});
}
function drawHUD(t,S){
  const c='rgba(170,185,215,0.62)';
  // corner ticks
  ctx.strokeStyle='rgba(200,215,255,0.25)';ctx.lineWidth=1.5;
  for(const [x,y,dx,dy] of [[40,40,1,1],[W-40,40,-1,1],[40,H-40,1,-1],[W-40,H-40,-1,-1]]){ctx.beginPath();ctx.moveTo(x,y+dy*22);ctx.lineTo(x,y);ctx.lineTo(x+dx*22,y);ctx.stroke();}
  txt('MLP  4 → 6 → 6 → 3',W-112,82,JB(700,18),'#e6ebf5','right','2px');
  txt(NPARAM+' PARAMETERS · ReLU · SOFTMAX',W-112,108,JB(400,14),c,'right','2px');
  txt('IRIS DATASET · FLOWER #'+String(SI+1).padStart(3,'0'),W-112,130,JB(400,14),c,'right','2px');
  // legend
  const lx=W-492,ly=172;ctx.lineCap='round';
  ctx.strokeStyle=rgba(POS,.9);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+34,ly);ctx.stroke();txt('+ weight',lx+44,ly+5,JB(400,14),c);
  ctx.strokeStyle=rgba(NEG,.9);ctx.beginPath();ctx.moveTo(lx+140,ly);ctx.lineTo(lx+174,ly);ctx.stroke();txt('− weight',lx+184,ly+5,JB(400,14),c);
  ctx.globalCompositeOperation='lighter';ctx.drawImage(GL.warm,lx+262,ly-14,28,28);ctx.globalCompositeOperation='source-over';txt('activation',lx+296,ly+5,JB(400,14),c);
  txt('thickness = |w|  ·  brightness = a',W-112,ly+30,JB(400,13),'rgba(170,185,215,0.45)','right','1px');
  // timecode + beat
  const tc=t.toFixed(2).padStart(5,'0');txt('00:'+tc,W-112,H-58,JB(700,20),'#e6ebf5','right','2px');
  const bi=Math.floor(t/BEAT),bar=Math.floor(bi/4)+1,bt=bi%4,kick=Math.exp(-((t/BEAT)%1)*6);
  txt('120 BPM · BAR '+String(bar).padStart(2,'0'),W-112,H-86,JB(400,13),c,'right','2px');
  for(let k=0;k<4;k++){const on=k===bt;ctx.fillStyle=on?rgba(ACID,.4+.6*kick):'rgba(200,215,255,0.2)';ctx.fillRect(W-330+k*16,H-66,10,on?10:10);}
}
function flashes(t){let f=0;for(const c of CUTS){if(t>=c)f=Math.max(f,Math.exp(-(t-c)*14));}
  if(FLIP!==null&&t>=FLIP)f=Math.max(f,.8*Math.exp(-(t-FLIP)*12));
  if(f>0.01){ctx.fillStyle='rgba(235,242,255,'+(0.13*f)+')';ctx.fillRect(0,0,W,H);}}
function glitch(t){
  const g=Math.max(win(t,T.le,T.le+.32,.02,.2),.5*win(t,T.pr,T.pr+.12,.01,.1));if(g<=0.01)return;
  bctx.clearRect(0,0,W,H);bctx.drawImage(cv,0,0);const r=mulberry32(Math.floor(t*30)*7919+13);
  for(let k=0;k<14;k++){const y=r()*H|0,h=(8+r()*70)|0,dx=(r()-.5)*180*g;ctx.drawImage(buf,0,y,W,h,dx,y,W,h);}
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35*g;ctx.drawImage(buf,14*g,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(255,56,88,'+(.08*g)+')';ctx.fillRect(0,0,W,H);
}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

// ---------------------------------------------------------------- frame
function render(t){
  const S=state(t);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawBG(t);
  const [s,cx,cy]=cam(t),kick=1+0.007*Math.exp(-((t/BEAT)%1)*8);
  ctx.setTransform(s*kick,0,0,s*kick,960-cx*s*kick,540-cy*s*kick);
  // intro/outro: the network sits back while type is up
  const dim=1-.45*Math.max(win(t,.5,2.05,.2,.15),win(t,T.out,19.7,.2,.3));
  ctx.globalAlpha=1;
  ctx.save();ctx.globalAlpha=dim;drawEdges(t,S);ctx.restore();
  drawPulses(t,S);drawNodes(t,S);drawChips(t);drawBars(t,S);drawLayerLabels(t,S);
  ctx.setTransform(1,0,0,1,0,0);
  drawReluPanel(t);drawEquations(t,S);drawLearn(t,S);drawCaption(t);drawKinetic(t,S);drawHUD(t,S);
  vignette();flashes(t);glitch(t);
  ctx.globalAlpha=.042;ctx.imageSmoothingEnabled=true;ctx.drawImage(GRAIN[Math.floor(t*30+1e-6)%4],0,0,W,H);ctx.globalAlpha=1;
}
window.seek=function(sec){let t=((+sec%D)+D)%D;if(t>D-1e-9)t=0;render(t);};
window.__model={M,F,FLIP,F1,F2,NPARAM,EFLIP,WARP};

// ---------------------------------------------------------------- boot
const q=new URLSearchParams(location.search),qs=q.get('seek');
window.__ready=Promise.all([document.fonts.load(SG(700,100)),document.fonts.load(SG(500,100)),document.fonts.load(JB(400,20)),document.fonts.load(JB(700,20))]).then(()=>document.fonts.ready).then(()=>{
  if(qs!==null){window.seek(parseFloat(qs));}
  else if(!window.__capture){const t0=performance.now();const loop=now=>{if(!window.__capture)window.seek((now-t0)/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
  else window.seek(0);
  return true;});
})();
</script>
