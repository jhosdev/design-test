      :root {
        --bg: #0a0e15;
        --panel: #101722;
        --line: #1f2939;
        --fg: #efe8d8;
        --dim: #939cb0;
        --amber: #ffb547;
        --neg: #86a0d6;
        --trace: #fff3dc;
        --serif: "Instrument Serif", serif;
        --mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
      }
      #scene { position: absolute; inset: 0; }

      /* ---------- background layer ---------- */
      .bg-grid {
        position: absolute;
        left: -80px; top: -80px;
        width: 2080px; height: 1240px;
        background-image: radial-gradient(circle, rgba(147, 156, 176, 0.22) 1.6px, transparent 2px);
        background-size: 40px 40px;
        will-change: transform;
      }
      .bg-glow {
        position: absolute;
        left: 560px; top: 90px;
        width: 1100px; height: 960px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 181, 71, 0.2), rgba(255, 181, 71, 0.06) 55%, transparent 100%);
        opacity: 0.8;
      }
      .bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 75% 70% at 55% 50%, transparent 55%, rgba(4, 6, 10, 0.75) 100%);
      }
      .ghost {
        position: absolute;
        right: -60px; bottom: -120px;
        font-family: var(--serif);
        font-style: italic;
        font-size: 420px;
        line-height: 1;
        color: rgba(239, 232, 216, 0.06);
        white-space: nowrap;
        will-change: transform;
      }

      /* ---------- header ---------- */
      .header { position: absolute; left: 96px; top: 52px; }
      .title {
        font-family: var(--serif);
        font-size: 68px;
        line-height: 1;
        letter-spacing: -0.02em;
        font-weight: 400;
        color: var(--fg);
      }
      .title em { color: var(--amber); font-style: italic; }
      .meta {
        margin-top: 16px;
        font-size: 18px;
        letter-spacing: 0.08em;
        color: var(--dim);
      }
      .rule {
        position: absolute;
        left: 96px; right: 96px; top: 176px;
        height: 2px;
        background: var(--line);
        transform-origin: left center;
      }
      .rail {
        position: absolute;
        right: 96px; top: 70px;
        display: flex;
        gap: 26px;
        font-size: 18px;
        letter-spacing: 0.06em;
      }
      .rail span { display: block; color: var(--dim); position: relative; }
      .rail span b { color: var(--amber); font-weight: 700; margin-right: 6px; opacity: 0.55; }
      .rail-bar {
        position: absolute;
        top: 104px; height: 4px;
        background: var(--amber);
        transform-origin: left center;
        border-radius: 2px;
      }

      /* ---------- input image ---------- */
      .in-caption {
        position: absolute; left: 96px; top: 206px;
        font-size: 18px; letter-spacing: 0.1em; color: var(--dim);
      }
      .in-grid { position: absolute; left: 96px; top: 240px; width: 268px; height: 268px; }
      .px-frame {
        position: absolute; inset: -10px;
        border: 2px solid var(--line);
        border-radius: 14px;
      }
      .px {
        position: absolute;
        width: 84px; height: 84px;
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      .px .fill { position: absolute; inset: 0; background: var(--amber); }
      .px .v {
        position: absolute; left: 0; right: 0; bottom: 6px;
        text-align: center; font-size: 17px; font-weight: 700;
      }
      .px .hl {
        position: absolute; inset: 0;
        border: 4px solid var(--trace);
        border-radius: 8px;
        opacity: 0;
      }
      .flyer {
        position: absolute;
        width: 84px; height: 84px;
        border-radius: 8px;
        background: var(--amber);
        opacity: 0;
        will-change: transform;
      }

      /* ---------- readout cards ---------- */
      .card {
        position: absolute;
        left: 96px; top: 540px;
        width: 440px;
        opacity: 0;
        will-change: transform;
      }
      .card .k {
        font-size: 18px; letter-spacing: 0.1em; color: var(--amber); font-weight: 700;
      }
      .card .k span { color: var(--dim); font-weight: 400; }
      .card .f {
        margin-top: 8px; margin-bottom: 12px;
        font-family: var(--serif); font-size: 38px; line-height: 1.05; color: var(--fg);
      }
      .card .f i { color: var(--amber); }
      .rows { font-size: 19px; line-height: 25px; white-space: pre; font-variant-numeric: tabular-nums; }
      .row { display: block; color: var(--dim); }
      .row .p { color: var(--amber); }
      .row .n { color: var(--neg); }
      .row .z { color: var(--dim); }
      .sumline {
        margin-top: 10px; padding-top: 10px;
        border-top: 2px solid var(--line);
        display: inline-flex; align-items: baseline; gap: 16px; padding-right: 8px;
        font-variant-numeric: tabular-nums;
      }
      .sumline .big { font-size: 40px; font-weight: 700; color: var(--fg); }
      .sumline .lab { font-size: 19px; color: var(--dim); }
      .relu { position: absolute; left: 290px; top: 118px; overflow: visible; }
      .foot {
        margin-top: 12px;
        font-size: 18px; line-height: 26px; color: var(--dim);
        white-space: normal;
      }
      .foot b { color: var(--neg); font-weight: 700; }
      .verdict .say {
        font-family: var(--serif);
        font-size: 74px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        max-width: 480px;
        margin-top: 10px;
      }
      .verdict .say em { color: var(--amber); font-style: italic; display: inline-block; }
      .verdict .sub { margin-top: 22px; font-size: 20px; line-height: 30px; color: var(--dim); }
      .verdict .sub b { color: var(--fg); }
      .verdict .sub.tight { margin-top: 0; }

      /* ---------- network ---------- */
      #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; }
      #net { position: absolute; left: 0; top: 0; }
      #net text { font-family: var(--mono); }
      .layer-lab { font-size: 18px; fill: var(--dim); letter-spacing: 0.04em; }

      /* ---------- outputs ---------- */
      .outrow { position: absolute; left: 1450px; width: 380px; height: 70px; }
      .outrow .ico {
        position: absolute; left: 0; top: 11px;
        width: 48px; height: 48px;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
      }
      .outrow .ico i { display: block; border-radius: 2px; background: #1c2536; }
      .outrow .ico i.on { background: var(--fg); }
      .outrow .nm { position: absolute; left: 66px; top: 6px; font-size: 20px; color: var(--fg); }
      .outrow .pct {
        position: absolute; right: 0; top: 6px; font-size: 20px; font-weight: 700; color: var(--dim);
        font-variant-numeric: tabular-nums; opacity: 0;
      }
      .outrow .track {
        position: absolute; left: 66px; right: 0; top: 44px; height: 12px;
        border-radius: 6px; background: #182131; overflow: hidden;
      }
      .outrow .bar {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        background: var(--amber); transform-origin: left center; border-radius: 6px;
      }

      .legend {
        position: absolute; left: 96px; bottom: 36px;
        display: flex; gap: 40px; align-items: center;
        font-size: 18px; color: var(--dim); letter-spacing: 0.04em;
      }
      .legend span { display: flex; align-items: center; gap: 12px; }
      .legend .sw { display: block; width: 40px; height: 5px; border-radius: 3px; }
      .legend .dot { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px rgba(255, 181, 71, 0.6); }
      .legend .ring { display: block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #3a4558; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="20" data-track-index="0">
        <div class="bg-grid" id="bg-grid"></div>
        <div class="bg-glow" id="bg-glow"></div>
        <div class="ghost" id="ghost" data-layout-ignore aria-hidden="true">σ(Wx + b)</div>
        <div class="bg-vignette" data-layout-ignore></div>

        <div id="world">
          <svg id="net" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="g-glow">
                <stop offset="0" stop-color="#ffb547" stop-opacity="0.9" />
                <stop offset="0.45" stop-color="#ff9a1f" stop-opacity="0.35" />
                <stop offset="1" stop-color="#ff9a1f" stop-opacity="0" />
              </radialGradient>
            </defs>
            <g id="g-edges"></g>
            <g id="g-pulses"></g>
            <g id="g-trace"></g>
            <g id="g-nodes"></g>
            <g id="g-labels"></g>
          </svg>
          <div id="outs"></div>
        </div>

        <div class="header">
          <div class="title">How a neural network <em>thinks</em></div>
          <div class="meta">MLP 9 → 6 → 5 → 4 · 104 WEIGHTS · EVERY NUMBER COMPUTED FROM THE WEIGHTS SHOWN</div>
        </div>
        <div class="rail" id="rail"></div>
        <div class="rail-bar" id="rail-bar"></div>
        <div class="rule" id="rule"></div>

        <div class="in-caption">INPUT · 3×3 IMAGE</div>
        <div class="in-grid" id="in-grid"><div class="px-frame"></div></div>
        <div id="flyers"></div>

        <div class="card" id="card-a"></div>
        <div class="card" id="card-b"></div>
        <div class="card" id="card-c"></div>
        <div class="card verdict" id="card-d"></div>

        <div class="legend">
          <span><i class="sw" style="background: var(--amber)"></i>positive weight</span>
          <span><i class="sw" style="background: var(--neg)"></i>negative weight</span>
          <span>thickness = |w|</span>
          <span><i class="dot"></i>brightness = activation</span>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const NS = "http://www.w3.org/2000/svg";
        const DUR = 20;

        // ------------------------------------------------------------------
        // The network. Weights are the ones drawn on screen (1 decimal).
        // Everything displayed below is computed from these at build time.
        // ------------------------------------------------------------------
        const W = [
          [[0.7,-0.3,-0.4,-0.4,0.8,-0.4,-0.4,-0.3,0.7],[-0.6,-0.2,0.8,-0.3,0.5,-0.3,0.8,-0.2,-0.6],[-0.2,0.4,-0.2,-0.2,0.3,-0.2,-0.2,0.4,-0.2],[-0.2,0.5,-0.2,0.5,-1,0.5,-0.3,0.4,-0.2],[0.7,0.6,0.7,-0.4,-0.1,-0.4,-0.3,-0.4,-0.3],[-1,-1,-1,0.5,0.5,0.5,0.5,0.5,0.4]],
          [[-0.6,-0.8,0.4,1,-0.5,-0.5],[-0.1,0.5,0,-0.2,-0.1,-0.2],[1.4,-0.6,-0.2,-0.7,0.2,0.1],[-0.3,0.3,-0.6,0,1.3,1.9],[-0.1,1.1,0,-0.7,-0.3,-0.6]],
          [[0,-0.3,-0.2,1.8,-0.9],[1.3,0,-0.8,-1.5,-0.1],[-0.8,0.5,-0.5,0.1,1.2],[-0.4,-0.2,1.4,-0.5,-0.2]],
        ];
        const B = [[0.9,0.7,0,1.4,0,0],[2.6,0.5,0.7,0.3,1.4],[0.1,1,-0.2,-0.6]];
        // 3×3 input image: a slightly noisy rising diagonal
        const X = [0.10,0.22,0.88, 0.18,0.71,0.30, 0.64,0.24,0.12];
        const CLASSES = [
          { name: "horizontal", sym: "—", ico: [0,0,0,1,1,1,0,0,0] },
          { name: "vertical", sym: "|", ico: [0,1,0,0,1,0,0,1,0] },
          { name: "rising diagonal", sym: "/", ico: [0,0,1,0,1,0,1,0,0] },
          { name: "falling diagonal", sym: "\\", ico: [1,0,0,0,1,0,0,0,1] },
        ];

        // forward pass
        const A = [X.slice()];
        const Z = [];
        for (let l = 0; l < 3; l++) {
          const prev = A[l];
          const z = W[l].map((row, j) => row.reduce((s, w, i) => s + w * prev[i], B[l][j]));
          Z.push(z);
          if (l < 2) A.push(z.map((v) => Math.max(0, v)));
          else {
            const m = Math.max(...z);
            const e = z.map((v) => Math.exp(v - m));
            const s = e.reduce((a, b) => a + b, 0);
            A.push(e.map((v) => v / s));
          }
        }
        const P = A[3];
        const WIN = P.indexOf(Math.max(...P));
        const RUNNER = P.map((p, i) => [p, i]).filter((d) => d[1] !== WIN).sort((a, b) => b[0] - a[0])[0][1];
        const EXPZ = Z[2].map((v) => Math.exp(v));
        const SUMEXP = EXPZ.reduce((a, b) => a + b, 0);

        const fmt = (v, d) => {
          const s = Math.abs(v).toFixed(d);
          return (v < 0 && +s !== 0 ? "−" : "") + s;
        };
        const sfmt = (v, d) => {
          const s = Math.abs(v).toFixed(d);
          return (v < 0 && +s !== 0 ? "−" : "+") + s;
        };
        const pad = (s, n) => (s.length >= n ? s : " ".repeat(n - s.length) + s);

        // ------------------------------------------------------------------
        // Geometry (pre-calculated; nothing measured at tween time)
        // ------------------------------------------------------------------
        const SIZES = [9, 6, 5, 4];
        const LX = [660, 900, 1140, 1380];
        const GAP = [80, 108, 122, 140];
        const CY = 568;
        const R = [19, 28, 28, 30];
        const pos = SIZES.map((n, l) =>
          Array.from({ length: n }, (_, i) => ({ x: LX[l], y: CY + (i - (n - 1) / 2) * GAP[l] })),
        );
        const NORM = A.map((a, l) => (l === 0 || l === 3 ? 1 : Math.max(...a)));
        const MAXW = Math.max(...W.flat(2).map(Math.abs));

        const C = { amber: "#ffb547", neg: "#86a0d6", fg: "#efe8d8", ink: "#0a0e15", trace: "#fff3dc", ring: "#3a4558" };
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };

        // edges + pulses + trace overlays
        const gE = document.getElementById("g-edges");
        const gP = document.getElementById("g-pulses");
        const gT = document.getElementById("g-trace");
        const edges = [[], [], []]; // edges[l][j][i]
        for (let l = 0; l < 3; l++) {
          for (let j = 0; j < SIZES[l + 1]; j++) {
            edges[l][j] = [];
            for (let i = 0; i < SIZES[l]; i++) {
              const a = pos[l][i], b = pos[l + 1][j];
              const w = W[l][j][i];
              const len = Math.hypot(b.x - a.x, b.y - a.y);
              const width = 0.8 + 5.2 * (Math.abs(w) / MAXW);
              const line = svgEl("line", {
                x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                stroke: w >= 0 ? C.amber : C.neg,
                "stroke-width": width.toFixed(2),
                "stroke-linecap": "round",
                opacity: 0.14,
              }, gE);
              const contrib = w * A[l][i];
              const seg = 70;
              const pulse = svgEl("line", {
                x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                stroke: contrib >= 0 ? C.amber : C.neg,
                "stroke-width": (width + 2.5).toFixed(2),
                "stroke-linecap": "round",
                "stroke-dasharray": `${seg} ${len + seg}`,
                "stroke-dashoffset": seg,
                opacity: 0,
              }, gP);
              // trace draws from the target back to the source
              const tr = svgEl("line", {
                x1: b.x, y1: b.y, x2: a.x, y2: a.y,
                stroke: C.trace,
                "stroke-width": 4,
                "stroke-linecap": "round",
                "stroke-dasharray": `${len} ${len}`,
                "stroke-dashoffset": len,
                opacity: 0,
              }, gT);
              edges[l][j][i] = { line, pulse, tr, len, seg, w, contrib };
            }
          }
        }

        // nodes
        const gN = document.getElementById("g-nodes");
        const nodes = pos.map((layer, l) =>
          layer.map((p, i) => {
            const g = svgEl("g", {}, gN);
            const glow = svgEl("circle", { cx: p.x, cy: p.y, r: R[l] * 2.6, fill: "url(#g-glow)", opacity: 0 }, g);
            svgEl("circle", { cx: p.x, cy: p.y, r: R[l], fill: C.ink, stroke: C.ring, "stroke-width": 2.5 }, g);
            const core = svgEl("circle", { cx: p.x, cy: p.y, r: R[l] - 1.5, fill: C.amber, opacity: 0 }, g);
            const ring = svgEl("circle", { cx: p.x, cy: p.y, r: R[l] + 7, fill: "none", stroke: C.trace, "stroke-width": 3, opacity: 0 }, g);
            const norm = Math.min(1, A[l][i] / NORM[l]);
            let val = null;
            if (l === 0) {
              val = svgEl("text", { x: p.x - R[l] - 12, y: p.y + 6, "text-anchor": "end", "font-size": 17, "font-weight": 700, fill: C.fg, opacity: 0 }, g);
              val.textContent = A[0][i].toFixed(2);
            } else if (l < 3) {
              val = svgEl("text", { x: p.x, y: p.y + 6, "text-anchor": "middle", "font-size": 16, "font-weight": 700, fill: norm > 0.5 ? C.ink : C.fg, opacity: 0 }, g);
              val.textContent = A[l][i].toFixed(2);
            }
            return { g, glow, core, ring, val, norm, p };
          }),
        );

        // layer labels
        const gL = document.getElementById("g-labels");
        const LABS = ["x · input", "h¹ = ReLU(W¹x+b¹)", "h² = ReLU(W²h¹+b²)", "p = softmax(W³h²+b³)"];
        LABS.forEach((t, l) => {
          const e = svgEl("text", { x: LX[l], y: 948, "text-anchor": "middle", class: "layer-lab" }, gL);
          e.textContent = t;
        });

        // input pixels + flyers
        const grid = document.getElementById("in-grid");
        const flyHost = document.getElementById("flyers");
        const pxs = X.map((v, i) => {
          const r = Math.floor(i / 3), c = i % 3;
          const left = c * 92, top = r * 92;
          const d = document.createElement("div");
          d.className = "px";
          d.style.left = left + "px";
          d.style.top = top + "px";
          d.innerHTML = `<div class="fill" style="opacity:${v}"></div><div class="v" style="color:${v > 0.5 ? C.ink : C.fg}">${v.toFixed(2)}</div><div class="hl"></div>`;
          grid.appendChild(d);
          const f = document.createElement("div");
          f.className = "flyer";
          f.style.left = 96 + left + "px";
          f.style.top = 240 + top + "px";
          flyHost.appendChild(f);
          const cx = 96 + left + 42, cy = 240 + top + 42;
          return { el: d, fill: d.querySelector(".fill"), hl: d.querySelector(".hl"), fly: f, dx: pos[0][i].x - cx, dy: pos[0][i].y - cy, v };
        });

        // outputs
        const outHost = document.getElementById("outs");
        const outs = CLASSES.map((c, k) => {
          const d = document.createElement("div");
          d.className = "outrow";
          d.style.top = pos[3][k].y - 35 + "px";
          d.innerHTML =
            `<div class="ico">${c.ico.map((o) => `<i class="${o ? "on" : ""}"></i>`).join("")}</div>` +
            `<div class="nm">${c.name}</div><div class="pct">0.0%</div>` +
            `<div class="track"><div class="bar"></div></div>`;
          outHost.appendChild(d);
          return { el: d, pct: d.querySelector(".pct"), bar: d.querySelector(".bar"), ico: d.querySelector(".ico"), nm: d.querySelector(".nm") };
        });

        // rail
        const RAIL = ["WEIGHTS", "INPUT", "LAYER 1", "LAYER 2", "SOFTMAX", "PREDICT"];
        const rail = document.getElementById("rail");
        RAIL.forEach((t, i) => {
          const s = document.createElement("span");
          s.innerHTML = `<b>0${i + 1}</b>${t}`;
          rail.appendChild(s);
        });

        // ------------------------------------------------------------------
        // Readout cards (content computed from W, B, X)
        // ------------------------------------------------------------------
        const FOCUS1 = 1; // h¹₂ : the rising-diagonal detector
        const SILENT1 = Z[0].findIndex((z) => z < 0); // first neuron ReLU clamps for this input
        const FOCUS2 = 4; // h²₅
        const sub = (n) => String(n).split("").map((d) => "₀₁₂₃₄₅₆₇₈₉"[+d]).join("");
        const cls = (v) => (v > 0.0005 ? "p" : v < -0.0005 ? "n" : "z");

        const cardA = document.getElementById("card-a");
        {
          const w = W[0][FOCUS1];
          const rows = X.map((x, i) => {
            const pr = x * w[i];
            return `<span class="row">x${sub(i + 1)}  ${x.toFixed(2)} × ${pad(sfmt(w[i], 1), 4)}  <span class="${cls(pr)}">${pad(sfmt(pr, 3), 6)}</span></span>`;
          }).join("");
          const brow = `<span class="row">bias          b  <span class="${cls(B[0][FOCUS1])}">${pad(sfmt(B[0][FOCUS1], 3), 6)}</span></span>`;
          cardA.innerHTML =
            `<div class="k">NEURON h¹${sub(FOCUS1 + 1)} <span>· z = Σ wᵢxᵢ + b</span></div>` +
            `<div class="f">Multiply, add, <i>then clip.</i></div>` +
            `<div class="rows">${rows}${brow}</div>` +
            `<div class="sumline"><span class="lab">z =</span><span class="big" id="a-z">0.000</span><span class="lab" id="a-relu">→ ReLU → ${A[1][FOCUS1].toFixed(3)}</span></div>` +
            `<div class="foot" id="a-foot">h¹${sub(SILENT1 + 1)}: z = ${fmt(Z[0][SILENT1], 3)} → ReLU → <b>0</b> · silenced</div>`;
          // mini ReLU plot
          const rs = svgEl("svg", { width: 132, height: 92, viewBox: "0 0 132 92", class: "relu", id: "relu" });
          const rl = svgEl("text", { x: 128, y: 90, "text-anchor": "end", "font-size": 15, fill: "#939cb0" }, rs);
          rl.textContent = "max(0, z)";
          svgEl("line", { x1: 4, y1: 76, x2: 128, y2: 76, stroke: "#3a4558", "stroke-width": 2 }, rs);
          svgEl("line", { x1: 60, y1: 8, x2: 60, y2: 88, stroke: "#3a4558", "stroke-width": 2 }, rs);
          svgEl("polyline", { points: "4,76 60,76 124,12", fill: "none", stroke: C.amber, "stroke-width": 3.5, "stroke-linejoin": "round" }, rs);
          // z axis: 1 unit = 24px
          const zx = 60 + Z[0][FOCUS1] * 24, zy = 76 - Math.max(0, Z[0][FOCUS1]) * 24;
          svgEl("circle", { cx: zx, cy: zy, r: 7, fill: C.trace, id: "relu-dot", opacity: 0 }, rs);
          cardA.appendChild(rs);
        }

        const cardB = document.getElementById("card-b");
        {
          const w = W[1][FOCUS2];
          const rows = A[1].map((h, i) => {
            const pr = h * w[i];
            return `<span class="row">h¹${sub(i + 1)} ${h.toFixed(3)} × ${pad(sfmt(w[i], 1), 4)}  <span class="${cls(pr)}">${pad(sfmt(pr, 3), 6)}</span></span>`;
          }).join("");
          const brow = `<span class="row">bias           b  <span class="${cls(B[1][FOCUS2])}">${pad(sfmt(B[1][FOCUS2], 3), 6)}</span></span>`;
          cardB.innerHTML =
            `<div class="k">NEURON h²${sub(FOCUS2 + 1)} <span>· reads layer 1</span></div>` +
            `<div class="f">Same recipe, <i>new inputs.</i></div>` +
            `<div class="rows">${rows}${brow}</div>` +
            `<div class="sumline"><span class="lab">z =</span><span class="big" id="b-z">0.000</span><span class="lab" id="b-relu">→ ReLU → ${A[2][FOCUS2].toFixed(3)}</span></div>` +
            `<div class="foot">Silenced neurons pass <b>0</b> forward: they cannot vote.</div>`;
        }

        const cardC = document.getElementById("card-c");
        {
          const rows = CLASSES.map((c, k) =>
            `<span class="row">${c.sym}  ${c.name.split(" ")[0].padEnd(10)} ${pad(sfmt(Z[2][k], 3), 6)}  ${pad(EXPZ[k].toFixed(3), 6)}  <span class="${k === WIN ? "p" : "z"}">${P[k].toFixed(3)}</span></span>`,
          ).join("");
          cardC.innerHTML =
            `<div class="k">OUTPUT <span>· softmax</span></div>` +
            `<div class="f">Scores become <i>probabilities</i></div>` +
            `<div class="rows"><span class="row">   ${"class".padEnd(10)} ${pad("z", 6)}  ${pad("exp(z)", 6)}  ${pad("p", 5)}</span>${rows}</div>` +
            `<div class="sumline"><span class="lab">Σ exp(z) =</span><span class="big">${SUMEXP.toFixed(3)}</span></div>` +
            `<div class="foot">p = exp(z) / Σ exp(z) · always sums to 1</div>`;
        }

        const cardD = document.getElementById("card-d");
        cardD.innerHTML =
          `<div class="k">PREDICTION</div>` +
          `<div class="say">It sees a <em>${CLASSES[WIN].name}.</em></div>` +
          `<div class="sub"><b>${(P[WIN] * 100).toFixed(1)}%</b> confident</div>` +
          `<div class="sub tight">runner-up · ${CLASSES[RUNNER].name} ${(P[RUNNER] * 100).toFixed(1)}%</div>` +
          `<div class="sub">Evidence traced back to the pixels that lit the path.</div>`;

        // ------------------------------------------------------------------
        // Timeline
        // ------------------------------------------------------------------
        const tl = gsap.timeline({ paused: true });
        const allEdges = edges.flat(2);
        const layerEdges = (l) => edges[l].flat();

        // ambient: seamless over exactly DUR seconds
        const grid$ = document.getElementById("bg-grid");
        const glow$ = document.getElementById("bg-glow");
        const ghost$ = document.getElementById("ghost");
        const amb = { t: 0 };
        tl.to(amb, {
          t: 1, duration: DUR, ease: "none",
          onUpdate: () => {
            const ph = amb.t * Math.PI * 2;
            grid$.style.transform = `translate(${(amb.t * 40).toFixed(2)}px, ${(amb.t * 40).toFixed(2)}px)`;
            glow$.style.opacity = (0.8 + 0.2 * Math.sin(ph * 4)).toFixed(3);
            glow$.style.transform = `scale(${(1 + 0.04 * Math.sin(ph * 4)).toFixed(4)})`;
            ghost$.style.transform = `translateX(${(-60 * Math.sin(ph)).toFixed(2)}px)`;
          },
        }, 0);

        // rail
        const railSpans = [...rail.children];
        const railBar = document.getElementById("rail-bar");
        const RAIL_T = [0.35, 1.35, 4.2, 8.2, 11.3, 14.4];
        const RAIL_END = 17.9;
        // pre-calculated rail layout (18px mono: 10.8px/char, 26px gap, right-aligned at 1824)
        const railW = RAIL.map((t) => (t.length + 2) * 10.8 + 6);
        const railX = [];
        let rx = 1824;
        for (let i = RAIL.length - 1; i >= 0; i--) { rx -= railW[i]; railX[i] = rx; rx -= 26; }
        gsap.set(railBar, { left: railX[0], width: railW[0] });
        tl.fromTo(railBar, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, RAIL_T[0]);
        RAIL_T.forEach((t, i) => {
          if (i > 0) tl.to(railBar, { x: railX[i] - railX[0], scaleX: railW[i] / railW[0], duration: 0.5, ease: "power3.inOut" }, t - 0.1);
          tl.to(railSpans[i], { color: C.fg, duration: 0.25, ease: "power1.out" }, t);
          const next = i < RAIL_T.length - 1 ? RAIL_T[i + 1] : RAIL_END;
          tl.to(railSpans[i], { color: "#939cb0", duration: 0.25, ease: "power1.in" }, next);
        });
        tl.to(railBar, { scaleX: 0, duration: 0.35, ease: "power2.in" }, RAIL_END);
        tl.set(railBar, { x: 0 }, RAIL_END + 0.4);

        // 01 WEIGHTS — the learned connections brighten, sweeping left → right
        allEdges.forEach((e) => {
          const lx = +e.line.getAttribute("x1");
          tl.to(e.line, { opacity: 0.5, duration: 0.7, ease: "sine.out" }, 0.35 + ((lx - 660) / 480) * 0.7);
        });

        // 02 INPUT — pixels pop in from the centre, then fly into the input neurons
        pxs.forEach((p, i) => {
          const r = Math.floor(i / 3), c = i % 3;
          const d = Math.abs(r - 1) + Math.abs(c - 1);
          tl.fromTo(p.el, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 1.45 + d * 0.09);
        });
        pxs.forEach((p, i) => {
          const t0 = 2.55 + i * 0.045;
          tl.fromTo(p.fly, { x: 0, y: 0, scale: 1, borderRadius: "8px", opacity: 0 },
            { x: p.dx, y: p.dy, scale: 0.45, borderRadius: "50%", opacity: 0.35 + 0.65 * p.v, duration: 0.75, ease: "power3.inOut" }, t0);
          tl.to(p.fly, { opacity: 0, duration: 0.15, ease: "power1.in" }, t0 + 0.72);
          const n = nodes[0][i];
          tl.fromTo(n.core, { opacity: 0 }, { opacity: n.norm, duration: 0.3, ease: "power2.out" }, t0 + 0.65);
          tl.fromTo(n.glow, { opacity: 0 }, { opacity: 0.4 * n.norm, duration: 0.4, ease: "power2.out" }, t0 + 0.65);
          tl.fromTo(n.val, { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, t0 + 0.7);
        });

        // camera
        const world = document.getElementById("world");
        const cam = (px, py, s, t, d, ease) =>
          tl.to(world, { x: px * (1 - s), y: py * (1 - s), scale: s, duration: d, ease }, t);
        gsap.set(world, { transformOrigin: "0 0", x: 0, y: 0, scale: 1 });

        // forward-pass helper
        const fire = (l, t0, span) => {
          const list = layerEdges(l);
          const maxC = Math.max(...list.map((e) => Math.abs(e.contrib)));
          edges[l].forEach((col, j) =>
            col.forEach((e, i) => {
              if (Math.abs(e.contrib) < 1e-9) return; // zero activation or zero weight: nothing flows
              const t = t0 + i * (span / SIZES[l]);
              const op = 0.35 + 0.65 * (Math.abs(e.contrib) / maxC);
              tl.set(e.pulse, { opacity: op }, t);
              tl.fromTo(e.pulse, { strokeDashoffset: e.seg }, { strokeDashoffset: -e.len, duration: 0.62, ease: "power1.inOut", immediateRender: false }, t);
              tl.set(e.pulse, { opacity: 0 }, t + 0.62);
            }),
          );
        };
        const light = (l, j, t) => {
          const n = nodes[l][j];
          tl.fromTo(n.core, { opacity: 0 }, { opacity: n.norm, duration: 0.35, ease: "power2.out" }, t);
          tl.fromTo(n.glow, { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 0.45 * n.norm, scale: 1, duration: 0.6, ease: "power2.out" }, t);
          if (n.val) tl.fromTo(n.val, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t + 0.1);
        };
        const cardIn = (el, t, from) =>
          tl.fromTo(el, { opacity: 0, x: from.x || 0, y: from.y || 0 }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "expo.out" }, t);
        const cardOut = (el, t) => tl.to(el, { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, t);
        const rowsIn = (el, t, each) => {
          [...el.querySelectorAll(".rows .row")].forEach((r, i) =>
            tl.fromTo(r, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, t + i * each),
          );
        };
        // running sum that steps through the true partial sums as each row lands
        const stepSum = (id, terms, t0, each) => {
          const el = document.getElementById(id);
          const o = { v: 0 };
          let acc = 0;
          tl.fromTo(o, { v: 0 }, { v: 0, duration: 0.01, onUpdate: () => { el.textContent = fmt(o.v, 3); } }, t0 - 0.02);
          terms.forEach((term, i) => {
            const from = acc;
            acc += term;
            tl.fromTo(o, { v: from }, { v: acc, duration: each * 0.9, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v, 3); } }, t0 + i * each);
          });
        };
        const countTo = (id, target, t, d) => {
          const el = document.getElementById(id);
          const o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: target, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v, 3); } }, t);
        };

        // 03 LAYER 1 — focus on h¹₂ while the whole layer computes
        // periphery recedes while the camera pushes in; outputs return when the signal arrives
        tl.to("#outs", { opacity: 0, duration: 0.45, ease: "power2.in" }, 4.2);
        tl.to("#outs", { opacity: 1, duration: 0.6, ease: "power2.out" }, 11.5);
        cam(900, 568, 1.13, 4.25, 1.1, "power2.inOut");
        cardIn(cardA, 4.5, { x: -40 });
        rowsIn(cardA, 5.15, 0.1);
        edges[0].forEach((col, j) => { if (j !== FOCUS1) col.forEach((e) => tl.to(e.line, { opacity: 0.2, duration: 0.4, ease: "power1.inOut" }, 4.6)); });
        edges[0][FOCUS1].forEach((e) => tl.to(e.line, { opacity: 0.95, duration: 0.4, ease: "power1.inOut" }, 4.6));
        fire(0, 4.95, 0.7);
        stepSum("a-z", X.map((x, i) => x * W[0][FOCUS1][i]).concat([B[0][FOCUS1]]), 5.15, 0.1);
        light(1, FOCUS1, 6.15);
        tl.fromTo("#relu-dot", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, 6.3);
        tl.fromTo("#a-relu", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.35);
        tl.fromTo(nodes[1][FOCUS1].ring, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 6.15);
        tl.to(nodes[1][FOCUS1].ring, { opacity: 0, duration: 0.4, ease: "power2.in" }, 7.6);
        layerEdges(0).forEach((e) => tl.to(e.line, { opacity: 0.5, duration: 0.5, ease: "sine.inOut" }, 6.6));
        [0, 1, 2, 3, 4, 5].filter((j) => j !== FOCUS1).forEach((j, k) => light(1, j, 6.65 + k * 0.1));
        // silenced neuron: a negative flash on its ring
        tl.fromTo(nodes[1][SILENT1].ring, { opacity: 0, stroke: C.neg }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 7.1);
        tl.to(nodes[1][SILENT1].ring, { opacity: 0, duration: 0.5, ease: "power1.in" }, 7.9);
        tl.fromTo("#a-foot", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.1);
        cardOut(cardA, 8.15);

        // 04 LAYER 2 — the camera slides right; h²₅ reads layer 1's answers
        cam(1100, 568, 1.13, 8.15, 0.9, "power3.inOut");
        cardIn(cardB, 8.5, { y: 30 });
        rowsIn(cardB, 9.0, 0.1);
        edges[1][FOCUS2].forEach((e) => tl.to(e.line, { opacity: 0.95, duration: 0.3, ease: "power1.out" }, 8.6));
        fire(1, 8.85, 0.5);
        stepSum("b-z", A[1].map((h, i) => h * W[1][FOCUS2][i]).concat([B[1][FOCUS2]]), 9.0, 0.1);
        [4, 0, 1, 2, 3].forEach((j, k) => light(2, j, 9.75 + k * 0.1));
        tl.fromTo("#b-relu", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 9.8);
        edges[1][FOCUS2].forEach((e) => tl.to(e.line, { opacity: 0.5, duration: 0.5, ease: "sine.inOut" }, 10.4));
        cardOut(cardB, 11.15);

        // 05 SOFTMAX — scores become probabilities
        cam(1500, 568, 1.04, 11.2, 0.9, "power2.inOut");
        cardIn(cardC, 11.55, { x: -40 });
        rowsIn(cardC, 11.8, 0.1);
        fire(2, 11.6, 0.45);
        CLASSES.forEach((c, k) => light(3, k, 12.3 + k * 0.06));
        outs.forEach((o, k) => {
          const t = 12.45 + k * 0.08;
          tl.fromTo(o.bar, { scaleX: 0 }, { scaleX: Math.max(0.004, P[k]), duration: 1.1, ease: "expo.out" }, t);
          tl.fromTo(o.pct, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t);
          const pr = { v: 0 };
          tl.fromTo(pr, { v: 0 }, { v: P[k] * 100, duration: 1.1, ease: "expo.out", onUpdate: () => { o.pct.textContent = pr.v.toFixed(1) + "%"; } }, t);
        });
        cardOut(cardC, 14.25);

        // 06 PREDICT — pull back, highlight the winner, trace the evidence
        cam(960, 540, 1, 14.3, 1.1, "power2.inOut");
        const wo = outs[WIN];
        tl.to(wo.pct, { color: C.amber, scale: 1.25, transformOrigin: "100% 50%", duration: 0.45, ease: "back.out(2.5)" }, 14.45);
        tl.to(wo.nm, { color: C.amber, duration: 0.3, ease: "power1.out" }, 14.45);
        tl.fromTo(wo.ico, { scale: 1 }, { scale: 1.18, duration: 0.45, ease: "back.out(3)" }, 14.45);
        tl.fromTo(nodes[3][WIN].ring, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 14.45);
        cardIn(cardD, 14.7, { y: 40 });
        tl.fromTo(cardD.querySelector(".say em"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 15.0);

        // evidence path: strongest positive contributions, back from the winner
        const pick = (l, j) => {
          const cs = edges[l][j].map((e, i) => ({ e, i, c: e.contrib })).filter((d) => d.c > 0).sort((a, b) => b.c - a.c);
          if (!cs.length) return [];
          return cs.filter((d) => d.c >= 0.3 * cs[0].c).slice(0, 3);
        };
        const traceEdges = [[], [], []];
        const onPath = [new Set(), new Set(), new Set(), new Set([WIN])];
        pick(2, WIN).forEach((d) => { traceEdges[2].push(d.e); onPath[2].add(d.i); });
        onPath[2].forEach((j) => pick(1, j).forEach((d) => { traceEdges[1].push(d.e); onPath[1].add(d.i); }));
        onPath[1].forEach((j) => pick(0, j).forEach((d) => { traceEdges[0].push(d.e); onPath[0].add(d.i); }));
        const TT = [15.8, 15.3, 14.8]; // draw order: output → input
        allEdges.forEach((e) => tl.to(e.line, { opacity: 0.1, duration: 0.5, ease: "power1.inOut" }, 14.8));
        [2, 1, 0].forEach((l) => {
          traceEdges[l].forEach((e, k) => {
            tl.set(e.tr, { opacity: 1 }, TT[l]);
            tl.fromTo(e.tr, { strokeDashoffset: e.len }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, TT[l] + k * 0.05);
          });
          onPath[l].forEach((i) => {
            if (l === 3) return;
            tl.fromTo(nodes[l][i].ring, { opacity: 0, stroke: C.trace }, { opacity: 1, duration: 0.3, ease: "power2.out" }, TT[l] + 0.45);
          });
        });
        onPath[0].forEach((i) => tl.fromTo(pxs[i].hl, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 16.3));
        // hold: winner glow breathes (bounded, 2 cycles)
        const wg = nodes[3][WIN].glow;
        const br = { p: 0 };
        tl.to(br, { p: Math.PI * 4, duration: 1.5, ease: "none", onUpdate: () => { wg.style.opacity = (0.45 * P[WIN] - 0.1 * Math.abs(Math.sin(br.p / 2))).toFixed(3); } }, 16.3);

        // ------------------------------------------------------------------
        // RESOLVE — everything returns to the exact t=0 rest state by 19.7s
        // ------------------------------------------------------------------
        const OUT = 17.9;
        cardOut(cardD, OUT);
        allEdges.forEach((e) => {
          tl.to(e.tr, { opacity: 0, duration: 0.4, ease: "power2.in" }, OUT + 0.1);
          tl.set(e.tr, { strokeDashoffset: e.len }, OUT + 0.55);
          tl.to(e.line, { opacity: 0.14, duration: 0.9, ease: "sine.inOut" }, OUT + 0.3);
        });
        nodes.flat().forEach((n, k) => {
          const t = OUT + 0.2 + (n.p.x - 660) / 720 * 0.5; // right-to-left dim, reversing the pass
          tl.to(n.core, { opacity: 0, duration: 0.45, ease: "power2.in" }, t);
          tl.to(n.glow, { opacity: 0, duration: 0.45, ease: "power2.in" }, t);
          tl.to(n.ring, { opacity: 0, duration: 0.3, ease: "power2.in" }, t);
          if (n.val) tl.to(n.val, { opacity: 0, duration: 0.3, ease: "power2.in" }, t);
        });
        outs.forEach((o, k) => {
          tl.to(o.bar, { scaleX: 0, duration: 0.5, ease: "power3.in" }, OUT + 0.1 + k * 0.04);
          tl.to(o.pct, { opacity: 0, duration: 0.3, ease: "power2.in" }, OUT + 0.1);
        });
        tl.to(wo.pct, { scale: 1, color: "#939cb0", duration: 0.3, ease: "power2.in" }, OUT + 0.1);
        tl.to(wo.nm, { color: C.fg, duration: 0.3, ease: "power2.in" }, OUT + 0.1);
        tl.to(wo.ico, { scale: 1, duration: 0.3, ease: "power2.in" }, OUT + 0.1);
        pxs.forEach((p, i) => {
          tl.to(p.hl, { opacity: 0, duration: 0.25, ease: "power2.in" }, OUT + 0.6);
          tl.to(p.el, { scale: 0.2, opacity: 0, duration: 0.35, ease: "back.in(2)" }, OUT + 0.9 + (8 - i) * 0.03);
        });
        // text rows of cards back to hidden happens implicitly (cards hidden at opacity 0)

        tl.seek(0);
        window.__timelines["main"] = tl;
        window.DURATION = DUR;
      })();
    </script>
    
  </body>
