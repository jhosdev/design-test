/* ------------------------------------------------------------------ *

  constructor(data, children = [], op = '', label = '') {
    this.data = data; this.grad = 0; this._prev = children; this._op = op; this.label = label;

    if (t >= T4.zero && t < T4.zero + 0.6 && REV3[id] != null) return { grad: G1[id].grad, flash: 0, fadeOut: seg(t, T4.zero, T4.zero + 0.6) };
    return { grad: null, flash: 0 };
  }
  return { grad: G1[id].grad, flash: 1 - seg(t, rev, rev + 1.1) };
}

let BG = null;
function buildBG() {
  BG = document.createElement('canvas'); BG.width = W * K; BG.height = H * K; const b = BG.getContext('2d'); b.scale(K, K);
  b.fillStyle = C.bg; b.fillRect(0, 0, W, H);
  b.fillStyle = 'rgba(233,230,222,0.05)';
  for (let x = 40; x < W; x += 40) for (let y = 40; y < H; y += 40) { b.beginPath(); b.arc(x, y, 1.1, 0, 7); b.fill(); }
  const g = b.createRadialGradient(W / 2, H * .42, 200, W / 2, H / 2, 1250);
  g.addColorStop(0, 'rgba(11,13,18,0)'); g.addColorStop(1, 'rgba(0,0,0,0.72)'); b.fillStyle = g; b.fillRect(0, 0, W, H);
}

function header(t, idx, a, b) {

  txt(String(idx).padStart(2, '0') + ' / 07', 80, 76 - (1 - u) * 10, F.mono(600, 17), C.grad, 'left', al, 2);

}

function progressBar(t) {
  const x0 = 80, x1 = W - 80, y = 1050, gap = 8, total = x1 - x0 - gap * (CHAPTERS.length - 1);

  });
  ctx.restore();
}

/* ---- graph 1 layer (ch1 .. ch4) ---- */
function sceneGraph1(t) {
  const layerA = win(t, 6.8, 65.8, .3, .8); if (layerA <= 0.001) return;
  // ch2: nudge
  const h = HNUDGE * (eInOut(seg(t, 25.4, 27.8)) - eInOut(seg(t, 32.6, 33.6)));
  const cur = h > 0 ? buildExpr(h) : E1;
  const pathOn = win(t, 24.2, 33.8, .6, .6);
  const pathSet = new Set(['a', 'e', 'd', 'L', 'm1', 'p1', 'm2']);
  // ch3 focus
  let focusOps = new Set(), focusNodes = new Set();
  const s3 = t >= S3[0] && t < S3[4] ? S3.findLastIndex(s => t >= s) : -1;
  if (s3 === 0) focusNodes = new Set(['L']);
  if (s3 === 1) { focusOps = new Set(['m2']); focusNodes = new Set(['L', 'd', 'f']); }
  if (s3 === 2) { focusOps = new Set(['p1']); focusNodes = new Set(['d', 'e', 'c']); }
  if (s3 === 3) { focusOps = new Set(['m1']); focusNodes = new Set(['e', 'a', 'b']); }
  const focusAmt = s3 >= 0 ? win(t, S3[0], S3[4], .4, .6) : 0;
  // ch4 active node
  let active4 = null;
  if (t >= T4.loop - 0.1 && t < T4.loop + REVORDER.length * T4.dt) active4 = REVORDER[Math.floor((t - T4.loop) / T4.dt)] ?? null;
  const ch4 = win(t, T4.loop - .2, 64.8, .2, .4);

  ctx.save(); withLayer(layerA, () => {
  // edges + ops
  for (const op of GR1.ops) {
    const od = OPDRAW[op.id];
    const pe = eInOut(seg(t, od, od + .55)), po = eInOut(seg(t, od + .35, od + .8));
    const dimE = pathOn > 0 && !pathSet.has(op.id) ? pathOn : (focusAmt > 0 && !focusOps.has(op.id) ? focusAmt * .7 : 0);
    const onPath = pathOn > 0 && pathSet.has(op.id) ? pathOn : 0;
    const fwdDraw = 1 - seg(t, od + .8, od + 2.2);
    const ecol = onPath > 0 ? mix('#5a6070', C.fwd, onPath) : fwdDraw > 0 && t < 24 ? mix('#5a6070', C.fwd, fwdDraw) : (focusOps.has(op.id) ? mix('#5a6070', C.grad, focusAmt * .8) : '#5a6070');
    for (const i of op.ins) drawEdge(edgeIn(GR1, i, op), pe, ecol, 1 - dimE * .6);
    drawEdge(edgeOut(GR1, op), po, ecol, 1 - dimE * .6);
    drawOp(op, eOut(seg(t, od + .2, od + .7)), 1 - dimE * .6, Math.max(onPath * .8, focusOps.has(op.id) ? focusAmt : 0), onPath > 0 ? C.fwd : C.grad);
  }
  // cards
  const anatomy = t < 12.8;
  for (const id in GR1.nodes) {
    const n = GR1.nodes[id];
    if (id === 'a' && anatomy) continue;
    const ap = eOut(seg(t, APPEAR1[id], APPEAR1[id] + .5));
    const gs = gradState(id, t);
    let grad = gs.grad; let flash = gs.flash;
    const dimN = pathOn > 0 && !pathSet.has(id) ? pathOn : (focusAmt > 0 && !focusNodes.has(id) ? focusAmt * .55 : 0);
    const fwdNew = t < 24 ? 1 - seg(t, APPEAR1[id] + .3, APPEAR1[id] + 1.6) : 0;
    let fwd = Math.max(pathSet.has(id) ? pathOn * 0.65 : 0, fwdNew * (id === 'a' ? 0 : .8));
    if (id === 'L') fwd = Math.max(fwd, win(t, 20.8, 23.6, .4, .8));
    let alphaMul = 1;
    if (gs.fadeOut != null) { alphaMul = 1; }
    const st = { appear: ap, data: f4(cur[id].data), grad, gradFlash: flash, fwd, dim: dimN, focus: focusNodes.has(id) ? focusAmt : 0 };
    if (gs.fadeOut != null) { st.grad = gs.fadeOut > .5 ? null : grad; }
    if (active4 === id) st.focus = ch4, st.gradFlash = Math.max(st.gradFlash, 0);
    drawCard(n, st);
    if (active4 === id) { ctx.save(); setAlpha(ch4); rrect(n.x - 6, n.y - 6, CW + 12, CH + 12, 14); ctx.strokeStyle = C.grad; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.restore(); }
  }
  // anatomy card for 'a'
  {
    const n = GR1.nodes.a; const mv = eInOut(seg(t, 11.7, 12.8));
    if (t < 12.8) {
      const bx = 520, by = 250, sc = lerp(2.0, 1, mv);
      const x = lerp(bx, n.x, mv), y = lerp(by, n.y, mv);
      drawCard(n, { appear: eOut(seg(t, 7.4, 8.1)), data: f4(2), grad: null }, x, y, sc);
      // annotations
      const aa = win(t, 8.2, 11.9, .5, .4);
      const cxr = x + CW / 2 + CW * sc / 2; // right edge of scaled card
      const cyc = y + CH / 2;
      const rowY = [cyc - 36 * sc, cyc, cyc + 36 * sc];
      const notes = [
        ['label', 'a name, just for drawing', C.ink, 8.2],
        ['data', 'the number it holds', C.ink, 8.9],
        ['grad', '∂L/∂(this value), starts at 0', C.grad, 9.6],
      ];
      notes.forEach(([k, s, col, t0], i) => {
        const u = eOut(seg(t, t0, t0 + .5)) * aa; if (u <= 0.001) return;
        const ly = rowY[i];
        ctx.save(); setAlpha(u); ctx.strokeStyle = 'rgba(233,230,222,0.35)'; ctx.lineWidth = 1.2; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.moveTo(cxr + 16, ly); ctx.lineTo(cxr + 16 + 90 * u, ly); ctx.stroke(); ctx.restore();
        txt(k, cxr + 124, ly + 7, F.mono(600, 22), col, 'left', u);
        txt(s, cxr + 214, ly + 7, F.sans(400, 26), C.dim, 'left', u);
      });
      const u4 = eOut(seg(t, 10.3, 10.8)) * aa;
      rich([['_prev', '#ffffff'], [', ', C.dim], ['_op', '#ffffff'], ['   its children, and the op that made it', C.dim]], cxr + 124, rowY[2] + 7 + 72, F.mono(400, 22), u4);
    }
  }
  }); ctx.restore();

  // ch3 pulses
  withLayer(layerA, () => {
  const P = (op, ins, t0) => { for (const i of ins) pulse(chainBack(GR1, op, i), eInOut(seg(t, t0, t0 + 1.3)), C.grad); };
  if (t > 34 && t < 55) { P('m2', ['d', 'f'], REV3.d - 1.25); P('p1', ['e', 'c'], REV3.e - 1.25); P('m1', ['a', 'b'], REV3.a - 1.25); }
  if (t > 60 && t < 65) {
    REVORDER.forEach((id, i) => { const v = E1[id]; if (!v._prev.length) return; const op = { L: 'm2', d: 'p1', e: 'm1' }[id];
      const t0 = T4.loop + i * T4.dt; for (const ch of v._prev) pulse(chainBack(GR1, op, ch.label), eInOut(seg(t, t0, t0 + .45)), C.grad); });
  }
  // ch2 forward pulse on nudged path
  if (t > 25.2 && t < 28.6) {
    const ch = [edgeIn(GR1, 'a', opOf(GR1, 'm1')), edgeOut(GR1, opOf(GR1, 'm1')), edgeIn(GR1, 'e', opOf(GR1, 'p1')), edgeOut(GR1, opOf(GR1, 'p1')), edgeIn(GR1, 'd', opOf(GR1, 'm2')), edgeOut(GR1, opOf(GR1, 'm2'))];
    fpulse(ch, eInOut(seg(t, 25.4, 28.2)), C.fwd);
  }
  });
}

/* ---- chapter 2: nudge ---- */
function sceneCh2(t) {
  const al = win(t, 23, 34.2, .5, .6); if (al <= 0.001) return;

  rich([['L(a)      = ', C.dim], [f4(G1.L.data).replace('-', MINUS), C.ink]], LP.x, y0 + lh, fm, al * a2);

  const a4 = win(t, 29.4, 34.2, .5, .6);

  // plot panel

    ctx.save(); setAlpha(pa);

    ctx.stroke();

/* ---- chapter 3: backward ---- */
const CODE_SEED = ['# start at the output', 'L.grad = 1.0        # dL/dL'];
const CODE_MUL = [
  'def __mul__(self, other):',
  "    out = Value(self.data * other.data, (self, other), '*')",
  '    def _backward():',
  '        self.grad  += other.data * out.grad',
  '        other.grad += self.data  * out.grad',
  '    out._backward = _backward',
  '    return out',
];
const CODE_ADD = [
  'def __add__(self, other):',
  "    out = Value(self.data + other.data, (self, other), '+')",
  '    def _backward():',
  '        self.grad  += 1.0 * out.grad',
  '        other.grad += 1.0 * out.grad',
  '    out._backward = _backward',
  '    return out',
];
function sceneCh3(t) {
  const al = win(t, 34, 55.2, .5, .6); if (al <= 0.001) return;
  header(t, 3, 34, 55.2);
  panel(RP.x, RP.y, RP.w, RP.h, al * eOut(seg(t, 34.4, 35)), 'micrograd/engine.py');
  const codeIn = (a, b) => win(t, a, b, .35, .35) * al;
  drawCode(CODE_SEED, RP.x + 34, RP.y + 100, { size: 20, lh: 40, alpha: codeIn(S3[0], S3[1]), hi: i => i === 1 ? win(t, 35.0, 37.2, .2, .2) : 0, hiW: 750 });
  const mulA = Math.max(codeIn(S3[1], S3[2]), codeIn(S3[3], S3[4] + 1.9));

}

  });
  ctx.restore();
  const u1 = eOut(seg(t, 89.3, 90.2)), u2 = eOut(seg(t, 90.6, 91.6)), u3 = eOut(seg(t, 91.9, 92.7)), u4 = eOut(seg(t, 92.8, 93.6));
  txt('That’s it.', W / 2, 520 - (1 - u1) * 24, F.sans(700, 150), C.ink, 'center', u1, -4);
  txt('Everything else is just efficiency.', W / 2, 628 - (1 - u2) * 20, F.serif(78), C.grad, 'center', u2);
  txt('A Value, a graph, the chain rule, and a loop: micrograd is about 100 lines.', W / 2, 720, F.sans(400, 28), C.dim, 'center', u3);
  txt('After Andrej Karpathy, “The spelled-out intro to neural networks and backpropagation: building micrograd”', W / 2, 930, F.mono(400, 17), C.dim, 'center', u4 * .75);
  }); ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  render / seek / playback                                           *
 * ------------------------------------------------------------------ */
let cur = 0;
function render(t) {
  t = clamp(t, 0, DURATION); cur = t;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.globalAlpha = 1; ctx.drawImage(BG, 0, 0, W, H);
  sceneTitle(t);
  sceneGraph1(t);
  sceneCh1(t); sceneCh2(t); sceneCh3(t); sceneCh4(t); sceneCh5(t); sceneCh6(t);
  sceneOutro(t);
  wordmark(t);
  progressBar(t);
}
window.seek = t => { render(+t || 0); };
Object.defineProperty(window, '__time', { get: () => cur });

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const st = document.getElementById('stage');
  st.style.transform = `scale(${s})`; st.style.left = ((innerWidth - W * s) / 2) + 'px'; st.style.top = ((innerHeight - H * s) / 2) + 'px';
  const k = Math.min(2, Math.max(1, s * (window.devicePixelRatio || 1)));
  if (k !== K || !BG) { K = k; cv.width = Math.round(W * K); cv.height = Math.round(H * K); buildBG(); }
}

const params = new URLSearchParams(location.search);
const seekParam = params.get('seek');
let playing = false, last = 0;
function loop(now) {
  if (playing) { const dt = clamp((now - last) / 1000, 0, 0.1); last = now; let t = cur + dt; if (t >= DURATION) { t = DURATION; playing = false; } render(t); }
  requestAnimationFrame(loop);
}

let readyResolve; window.__ready = new Promise(r => readyResolve = r);
const fontLoads = [F.sans(400, 20), F.sans(500, 20), F.sans(700, 20), F.mono(400, 20), F.mono(600, 20), F.serif(20), F.serif(20, false)]
  .map(f => document.fonts.load(f, 'Ab∂→×²'));
Promise.all(fontLoads).then(() => document.fonts.ready).catch(() => {}).then(() => {
  fit(); addEventListener('resize', () => { fit(); render(cur); });
  const t0 = seekParam != null ? +seekParam : 0;
  render(t0);
  if (!window.__capture && seekParam == null) { playing = true; last = performance.now(); }
  requestAnimationFrame(loop);
  readyResolve();
});

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing && cur >= DURATION) cur = 0; playing = !playing; last = performance.now(); flashHint(); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault(); const i = chapterAt(cur + 0.05);
    let j = e.code === 'ArrowRight' ? Math.min(CHAPTERS.length - 1, i + 1) : (cur - CHAPTERS[i].t > 1.5 ? i : Math.max(0, i - 1));
    render(CHAPTERS[j].t + (j ? 0.01 : 0)); last = performance.now(); flashHint();
  }
});
let hintTimer = 0;
function flashHint() { const h = document.getElementById('hint'); h.style.opacity = 1; clearTimeout(hintTimer); hintTimer = setTimeout(() => h.style.opacity = 0, 1800); }
})();
</script>
